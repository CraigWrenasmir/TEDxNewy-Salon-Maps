<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEDx Newy Salon — Map Print Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #FF2B06;
  --red-dim: #FF2B0633;
  --red-glow: #FF2B0618;
  --bg: #0a0a0c;
  --surface: #111114;
  --surface-2: #18181c;
  --surface-3: #222228;
  --border: #2a2a30;
  --border-light: #3a3a42;
  --text: #e8e8ec;
  --text-dim: #8a8a94;
  --text-muted: #5a5a64;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --header-h: 52px;
  --switcher-h: 40px;
  --toolbar-h: 42px;
  --top-offset: calc(var(--header-h) + var(--switcher-h) + var(--toolbar-h));
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-tap-highlight-color: transparent;
}

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  backdrop-filter: blur(12px);
  background: rgba(17, 17, 20, 0.92);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.header-brand {
  display: flex;
  align-items: baseline;
  flex-shrink: 0;
}

.header-brand .tedx {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 15px;
  color: var(--red);
  letter-spacing: -0.02em;
}

.header-brand .newy {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 15px;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-left: 4px;
}

.header-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

.header-title {
  font-family: var(--sans);
  font-weight: 400;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.header-subtitle {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: var(--surface-2);
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.kbd-hint {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.kbd-hint kbd {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 9px;
  color: var(--text-dim);
}

/* ── MAP SWITCHER ── */
.map-switcher {
  position: fixed;
  top: var(--header-h);
  left: 0; right: 0;
  height: var(--switcher-h);
  background: rgba(14, 14, 17, 0.97);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 4px;
  z-index: 100;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.map-switcher::-webkit-scrollbar { display: none; }

.map-switcher-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 8px;
  flex-shrink: 0;
}

.map-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 400;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
  position: relative;
  flex-shrink: 0;
}

.map-btn:hover {
  background: var(--surface-2);
  border-color: var(--border);
  color: var(--text);
}

.map-btn.active {
  background: var(--red-dim);
  border-color: var(--red);
  color: #fff;
  font-weight: 500;
}

/* ── TOOLBAR (desktop) ── */
.toolbar {
  position: fixed;
  top: calc(var(--header-h) + var(--switcher-h));
  left: 0; right: 0;
  height: var(--toolbar-h);
  background: rgba(14, 14, 17, 0.95);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 6px;
  z-index: 100;
  backdrop-filter: blur(8px);
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 2px;
}

.tool-sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 8px;
}

.tool-btn {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
}

.tool-btn:hover {
  background: var(--surface-2);
  border-color: var(--border);
  color: var(--text);
}

.tool-btn.active {
  background: var(--red-dim);
  border-color: var(--red);
  color: var(--red);
}

.tool-btn.zoom-preset {
  min-width: 44px;
  text-align: center;
}

.tool-btn.zoom-preset.current {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-light);
}

.zoom-display {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  min-width: 56px;
  text-align: center;
  padding: 4px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
}

.zoom-slider-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 4px;
}

.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100px;
  height: 3px;
  background: var(--surface-3);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--red);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 6px var(--red-dim);
}

.tool-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 6px;
}

.tool-select {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  outline: none;
}

.tool-select:hover { border-color: var(--border-light); }
.tool-select:focus { border-color: var(--red); }

.tool-select option {
  background: var(--surface);
  color: var(--text);
}

/* ── MOBILE BOTTOM BAR ── */
.mobile-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 56px;
  background: rgba(14, 14, 17, 0.97);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 100;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.mobile-bar-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 9px;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.mobile-bar-btn:active {
  background: var(--surface-2);
}

.mobile-bar-btn.active {
  color: var(--red);
}

.mobile-bar-btn svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── MOBILE SETTINGS PANEL ── */
.mobile-settings {
  display: none;
  position: fixed;
  bottom: 56px;
  left: 0; right: 0;
  background: rgba(17, 17, 20, 0.97);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 99;
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
  transform: translateY(100%);
  transition: transform 0.25s ease;
}

.mobile-settings.open {
  transform: translateY(0);
}

.mobile-settings-section {
  margin-bottom: 14px;
}

.mobile-settings-section:last-child { margin-bottom: 0; }

.mobile-settings-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.mobile-settings-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.mobile-chip {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.mobile-chip:active { background: var(--surface-3); }

.mobile-chip.active {
  background: var(--red-dim);
  border-color: var(--red);
  color: var(--red);
}

/* ── VIEWPORT ── */
.viewport {
  position: fixed;
  top: var(--top-offset);
  left: 0; right: 0;
  bottom: 0;
  overflow: hidden;
  cursor: grab;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,43,6,0.02) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
  background-color: var(--bg);
}

.viewport.dragging { cursor: grabbing; }

.canvas-container {
  position: absolute;
  transform-origin: 0 0;
  will-change: transform;
}

.canvas-container img {
  display: block;
  image-rendering: auto;
  pointer-events: none;
}

/* ── PAPER OVERLAYS ── */
.paper-overlay {
  position: absolute;
  top: 0; left: 0;
  border: 2px dashed rgba(255, 255, 255, 0.5);
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.paper-overlay .paper-label {
  position: absolute;
  top: -1px; left: -1px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  color: #fff;
  white-space: nowrap;
}

.paper-overlay .paper-dims {
  position: absolute;
  bottom: 6px; right: 8px;
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
}

.paper-overlay[data-size="A0"] { border-color: #a78bfa; }
.paper-overlay[data-size="A0"] .paper-label { background: #a78bfa; color: #0a0a0c; }
.paper-overlay[data-size="A0"] .paper-dims { background: rgba(167, 139, 250, 0.2); color: #a78bfa; }

.paper-overlay[data-size="A1"] { border-color: #4ecdc4; }
.paper-overlay[data-size="A1"] .paper-label { background: #4ecdc4; color: #0a0a0c; }
.paper-overlay[data-size="A1"] .paper-dims { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; }

.paper-overlay[data-size="A2"] { border-color: var(--red); }
.paper-overlay[data-size="A2"] .paper-label { background: var(--red); color: #fff; }
.paper-overlay[data-size="A2"] .paper-dims { background: rgba(255, 43, 6, 0.2); color: var(--red); }

.paper-overlay[data-size="A3"] { border-color: #ffe66d; }
.paper-overlay[data-size="A3"] .paper-label { background: #ffe66d; color: #0a0a0c; }
.paper-overlay[data-size="A3"] .paper-dims { background: rgba(255, 230, 109, 0.2); color: #ffe66d; }

/* ── PRINT INFO PANEL ── */
.info-panel {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 280px;
  background: rgba(17, 17, 20, 0.94);
  border: 1px solid var(--border);
  border-radius: 8px;
  backdrop-filter: blur(12px);
  z-index: 90;
  overflow: hidden;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.info-panel.collapsed {
  transform: translateY(calc(100% - 36px));
}

.info-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}

.info-panel-header:hover { background: var(--surface-3); }

.info-panel-title {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}

.info-panel-toggle {
  font-size: 12px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
}

.info-panel.collapsed .info-panel-toggle { transform: rotate(180deg); }

.info-panel-body { padding: 14px; }

.info-section { margin-bottom: 14px; }
.info-section:last-child { margin-bottom: 0; }

.info-section-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
}

.info-row-label {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--text-dim);
}

.info-row-value {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
}

.info-row-value.match { color: var(--red); }

.info-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 4px;
  margin-top: 4px;
}

.info-badge.good {
  background: rgba(78, 205, 126, 0.12);
  color: #4ecd7e;
  border: 1px solid rgba(78, 205, 126, 0.25);
}

.info-badge.ok {
  background: rgba(255, 230, 109, 0.12);
  color: #ffe66d;
  border: 1px solid rgba(255, 230, 109, 0.25);
}

.info-badge.warn {
  background: rgba(255, 43, 6, 0.12);
  color: var(--red);
  border: 1px solid rgba(255, 43, 6, 0.25);
}

.info-badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ── SHARPNESS INDICATOR ── */
.sharpness-indicator {
  position: fixed;
  bottom: 16px;
  left: 16px;
  font-family: var(--mono);
  font-size: 10px;
  padding: 6px 12px;
  border-radius: 5px;
  backdrop-filter: blur(8px);
  z-index: 90;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid;
}

/* ── IMAGE DIMS ── */
.img-dims {
  position: absolute;
  bottom: -24px; left: 0;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
  white-space: nowrap;
  pointer-events: none;
}

/* ── LOADING ── */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.4s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loading-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 14px;
  letter-spacing: 0.04em;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── CROSSHAIR ── */
.crosshair {
  position: fixed;
  top: 50%; left: 50%;
  pointer-events: none;
  z-index: 50;
  opacity: 0.15;
}

.crosshair::before, .crosshair::after {
  content: '';
  position: absolute;
  background: var(--text-muted);
}

.crosshair::before {
  width: 1px; height: 20px;
  top: -10px; left: 0;
}

.crosshair::after {
  width: 20px; height: 1px;
  top: 0; left: -10px;
}

/* ═══════════════════════════════════
   MOBILE RESPONSIVE
   ═══════════════════════════════════ */
@media (max-width: 768px) {
  :root {
    --header-h: 44px;
    --switcher-h: 38px;
    --toolbar-h: 0px;
  }

  .header {
    padding: 0 12px;
  }

  .header-brand .tedx,
  .header-brand .newy {
    font-size: 13px;
  }

  .header-sep,
  .header-subtitle,
  .header-right {
    display: none;
  }

  .header-title {
    font-size: 12px;
  }

  .map-switcher {
    padding: 0 10px;
    gap: 4px;
    height: var(--switcher-h);
  }

  .map-switcher-label { display: none; }

  .map-btn {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
  }

  /* Hide desktop toolbar on mobile */
  .toolbar { display: none; }

  /* Show mobile bottom bar */
  .mobile-bar { display: flex; }

  /* Adjust viewport for bottom bar */
  .viewport { bottom: 56px; }

  /* Info panel: full width, above bottom bar */
  .info-panel {
    left: 8px;
    right: 8px;
    bottom: 64px;
    width: auto;
  }

  .info-panel.collapsed {
    transform: translateY(calc(100% - 34px));
  }

  /* Sharpness indicator above bottom bar */
  .sharpness-indicator {
    bottom: 64px;
    left: 8px;
    font-size: 9px;
    padding: 4px 10px;
  }

  /* Hide crosshair on mobile */
  .crosshair { display: none; }

  /* Mobile settings panel visible when open */
  .mobile-settings { display: block; }
}

/* Small phones */
@media (max-width: 400px) {
  .map-btn {
    font-size: 10px;
    padding: 4px 8px;
  }
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading map image…</div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-brand">
      <span class="tedx">TEDx</span><span class="newy">Newy Salon</span>
    </div>
    <div class="header-sep"></div>
    <span class="header-title" id="headerTitle">Night Culture and Economy</span>
    <span class="header-subtitle">Print Preview</span>
  </div>
  <div class="header-right">
    <div class="kbd-hint">
      <kbd>+</kbd><kbd>−</kbd> zoom
      <kbd>0</kbd> fit
      <kbd>1</kbd> 100%
      <kbd>P</kbd> panel
    </div>
  </div>
</div>

<!-- Map Switcher -->
<div class="map-switcher">
  <span class="map-switcher-label">Map</span>
  <button class="map-btn active" data-map="night-culture" onclick="switchMap('night-culture')">Night Culture</button>
  <button class="map-btn" data-map="health" onclick="switchMap('health')">Health + Wellbeing</button>
  <button class="map-btn" data-map="transport-cbd" onclick="switchMap('transport-cbd')">Transport CBD</button>
  <button class="map-btn" data-map="transport-regional" onclick="switchMap('transport-regional')">Transport Regional</button>
</div>

<!-- Toolbar (desktop) -->
<div class="toolbar">
  <div class="tool-group">
    <span class="tool-label">Zoom</span>
    <button class="tool-btn" onclick="zoomDelta(-0.15)" title="Zoom out">−</button>
    <div class="zoom-slider-wrap">
      <input type="range" class="zoom-slider" id="zoomSlider" min="2" max="250" value="20">
    </div>
    <button class="tool-btn" onclick="zoomDelta(0.15)" title="Zoom in">+</button>
    <div class="zoom-display" id="zoomDisplay">20%</div>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group">
    <button class="tool-btn zoom-preset" data-zoom="fit" onclick="zoomToFit()">Fit</button>
    <button class="tool-btn zoom-preset" data-zoom="0.5" onclick="setZoom(0.5)">50%</button>
    <button class="tool-btn zoom-preset" data-zoom="1" onclick="setZoom(1)">100%</button>
    <button class="tool-btn zoom-preset" data-zoom="2" onclick="setZoom(2)">200%</button>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group">
    <span class="tool-label">DPI</span>
    <select class="tool-select" id="dpiSelect" onchange="onDpiChange()">
      <option value="300" selected>300 DPI</option>
      <option value="200">200 DPI</option>
      <option value="150">150 DPI</option>
    </select>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group">
    <span class="tool-label">Paper</span>
    <button class="tool-btn" id="toggleA0" onclick="togglePaper('A0')">A0</button>
    <button class="tool-btn" id="toggleA1" onclick="togglePaper('A1')">A1</button>
    <button class="tool-btn active" id="toggleA2" onclick="togglePaper('A2')">A2</button>
    <button class="tool-btn" id="toggleA3" onclick="togglePaper('A3')">A3</button>
  </div>
</div>

<!-- Viewport -->
<div class="viewport" id="viewport">
  <div class="canvas-container" id="canvas">
    <img id="mapImg" draggable="false">
    <div class="img-dims" id="imgDims"></div>

    <div class="paper-overlay" id="overlayA0" data-size="A0" style="display:none;">
      <span class="paper-label">A0</span>
      <span class="paper-dims" id="dimsA0"></span>
    </div>
    <div class="paper-overlay" id="overlayA1" data-size="A1" style="display:none;">
      <span class="paper-label">A1</span>
      <span class="paper-dims" id="dimsA1"></span>
    </div>
    <div class="paper-overlay" id="overlayA2" data-size="A2">
      <span class="paper-label">A2</span>
      <span class="paper-dims" id="dimsA2"></span>
    </div>
    <div class="paper-overlay" id="overlayA3" data-size="A3" style="display:none;">
      <span class="paper-label">A3</span>
      <span class="paper-dims" id="dimsA3"></span>
    </div>
  </div>
  <div class="crosshair"></div>
</div>

<!-- Sharpness Indicator -->
<div class="sharpness-indicator" id="sharpness"></div>

<!-- Print Info Panel -->
<div class="info-panel collapsed" id="infoPanel">
  <div class="info-panel-header" onclick="togglePanel()">
    <span class="info-panel-title">Print Specifications</span>
    <span class="info-panel-toggle">▼</span>
  </div>
  <div class="info-panel-body">
    <div class="info-section">
      <div class="info-section-label">Source Image</div>
      <div class="info-row">
        <span class="info-row-label">Pixels</span>
        <span class="info-row-value" id="panelPixels"></span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Aspect ratio</span>
        <span class="info-row-value" id="panelRatio"></span>
      </div>
    </div>

    <div class="info-section">
      <div class="info-section-label">Print Size at <span id="panelDpi">300</span> DPI</div>
      <div class="info-row">
        <span class="info-row-label">Width</span>
        <span class="info-row-value" id="printW"></span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Height</span>
        <span class="info-row-value" id="printH"></span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Best paper fit</span>
        <span class="info-row-value match" id="bestFit"></span>
      </div>
    </div>

    <div class="info-section">
      <div class="info-section-label">Print Quality</div>
      <div id="qualityBadge"></div>
    </div>
  </div>
</div>

<!-- Mobile Bottom Bar -->
<div class="mobile-bar">
  <button class="mobile-bar-btn" onclick="zoomDelta(-0.2)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    <span>Zoom −</span>
  </button>
  <button class="mobile-bar-btn" onclick="zoomToFit()">
    <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    <span>Fit</span>
  </button>
  <button class="mobile-bar-btn" onclick="setZoom(1)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><text x="12" y="15" text-anchor="middle" font-size="9" font-family="var(--mono)" fill="currentColor" stroke="none">1:1</text></svg>
    <span>100%</span>
  </button>
  <button class="mobile-bar-btn" onclick="zoomDelta(0.2)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
    <span>Zoom +</span>
  </button>
  <button class="mobile-bar-btn" id="mobileSettingsBtn" onclick="toggleMobileSettings()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
  <button class="mobile-bar-btn" onclick="togglePanel()">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>Info</span>
  </button>
</div>

<!-- Mobile Settings Panel -->
<div class="mobile-settings" id="mobileSettings">
  <div class="mobile-settings-section">
    <div class="mobile-settings-label">Print DPI</div>
    <div class="mobile-settings-row">
      <button class="mobile-chip" data-dpi="150" onclick="setMobileDpi(150)">150</button>
      <button class="mobile-chip" data-dpi="200" onclick="setMobileDpi(200)">200</button>
      <button class="mobile-chip active" data-dpi="300" onclick="setMobileDpi(300)">300</button>
    </div>
  </div>
  <div class="mobile-settings-section">
    <div class="mobile-settings-label">Paper Overlay</div>
    <div class="mobile-settings-row">
      <button class="mobile-chip" data-paper="A0" onclick="togglePaperMobile('A0')">A0</button>
      <button class="mobile-chip" data-paper="A1" onclick="togglePaperMobile('A1')">A1</button>
      <button class="mobile-chip active" data-paper="A2" onclick="togglePaperMobile('A2')">A2</button>
      <button class="mobile-chip" data-paper="A3" onclick="togglePaperMobile('A3')">A3</button>
    </div>
  </div>
  <div class="mobile-settings-section">
    <div class="mobile-settings-label">Zoom Presets</div>
    <div class="mobile-settings-row">
      <button class="mobile-chip" onclick="setZoom(0.5);closeMobileSettings()">50%</button>
      <button class="mobile-chip" onclick="setZoom(1);closeMobileSettings()">100%</button>
      <button class="mobile-chip" onclick="setZoom(2);closeMobileSettings()">200%</button>
    </div>
  </div>
</div>

<script>
// ── Map configurations ──
const MAPS = {
  'night-culture': {
    title: 'Night Culture and Economy',
    file: 'Night Culture.png',
    w: 7021, h: 4967,
  },
  'health': {
    title: 'Health and Wellbeing',
    file: 'Health and Wellbeing.png',
    w: 5266, h: 3725,
  },
  'transport-cbd': {
    title: 'Transport and Mobility CBD',
    file: 'Transport and Mobility - CBD.png',
    w: 7021, h: 4967,
  },
  'transport-regional': {
    title: 'Transport and Mobility Regional',
    file: 'Transport and Mobility - Regional.png',
    w: 7021, h: 4967,
  },
};

let currentMapId = 'night-culture';

const PAPERS = {
  A0: { w: 1189, h: 841 },
  A1: { w: 841, h: 594 },
  A2: { w: 594, h: 420 },
  A3: { w: 420, h: 297 },
};

// ── State ──
let imgW = 7021, imgH = 4967;
let zoom = 0.2, panX = 0, panY = 0, dpi = 300;
let isDragging = false;
let dragStartX, dragStartY, panStartX, panStartY;
let paperVisible = { A0: false, A1: false, A2: true, A3: false };
let mobileSettingsOpen = false;

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
const mapImg = document.getElementById('mapImg');
const zoomSlider = document.getElementById('zoomSlider');
const zoomDisplay = document.getElementById('zoomDisplay');

// ── Responsive: uncollapse info panel on desktop ──
function isDesktop() { return window.innerWidth > 768; }

// ── Map switching ──
function switchMap(mapId) {
  const map = MAPS[mapId];
  if (!map) return;
  currentMapId = mapId;

  document.querySelectorAll('.map-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.map === mapId);
  });

  document.getElementById('headerTitle').textContent = map.title;

  const loading = document.getElementById('loading');
  loading.classList.remove('hidden');
  loading.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">Loading ' + map.title + '…</div>';

  mapImg.onload = function() {
    if (map.w && map.h) { imgW = map.w; imgH = map.h; }
    else { imgW = mapImg.naturalWidth; imgH = mapImg.naturalHeight; map.w = imgW; map.h = imgH; }
    document.getElementById('imgDims').textContent = `${imgW} × ${imgH} px`;
    zoomToFit();
    updateAll();
    setTimeout(() => loading.classList.add('hidden'), 200);
  };

  mapImg.onerror = function() {
    loading.innerHTML =
      '<div style="color:var(--text-dim);font-family:var(--mono);font-size:12px;text-align:center;line-height:1.8;padding:20px;">' +
      'Image not yet available:<br><span style="color:var(--text);">' + map.file + '</span>' +
      '<br><br><span style="color:var(--text-muted);font-size:11px;">Drop the PNG into the folder<br>with this filename, then refresh.</span></div>';
  };

  mapImg.src = map.file;
  closeMobileSettings();
}

switchMap('night-culture');

// ── Zoom ──
function setZoom(z, centerX, centerY) {
  const oldZoom = zoom;
  zoom = Math.max(0.02, Math.min(3, z));
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const cx = centerX !== undefined ? centerX : vw / 2;
  const cy = centerY !== undefined ? centerY : vh / 2;
  panX = cx - (cx - panX) * (zoom / oldZoom);
  panY = cy - (cy - panY) * (zoom / oldZoom);
  updateAll();
}

function zoomDelta(d) { setZoom(zoom * (1 + d)); }

function zoomToFit() {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const padding = 40;
  zoom = Math.min((vw - padding) / imgW, (vh - padding) / imgH);
  panX = (vw - imgW * zoom) / 2;
  panY = (vh - imgH * zoom) / 2;
  updateAll();
}

function updateAll() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;

  const pct = Math.round(zoom * 100);
  zoomDisplay.textContent = pct + '%';
  zoomSlider.value = Math.min(250, Math.max(2, pct));

  document.querySelectorAll('.zoom-preset').forEach(btn => {
    btn.classList.remove('current');
    const target = btn.dataset.zoom;
    if (target === 'fit') return;
    if (Math.abs(parseFloat(target) - zoom) < 0.005) btn.classList.add('current');
  });

  updatePaperOverlays();
  updatePrintInfo();
  updateSharpness();
}

// ── Paper overlays ──
function mmToPixels(mm) { return (mm / 25.4) * dpi; }

function updatePaperOverlays() {
  for (const [size, dims] of Object.entries(PAPERS)) {
    const el = document.getElementById('overlay' + size);
    const dimsEl = document.getElementById('dims' + size);
    if (!paperVisible[size]) { el.style.display = 'none'; continue; }
    const pw = mmToPixels(dims.w);
    const ph = mmToPixels(dims.h);
    el.style.display = 'block';
    el.style.width = pw + 'px';
    el.style.height = ph + 'px';
    dimsEl.textContent = `${dims.w} × ${dims.h} mm`;
  }
}

function togglePaper(size) {
  paperVisible[size] = !paperVisible[size];
  document.getElementById('toggle' + size).classList.toggle('active');
  updatePaperOverlays();
}

function togglePaperMobile(size) {
  paperVisible[size] = !paperVisible[size];
  // Sync desktop buttons
  const desktopBtn = document.getElementById('toggle' + size);
  if (desktopBtn) desktopBtn.classList.toggle('active', paperVisible[size]);
  // Sync mobile chips
  document.querySelectorAll(`.mobile-chip[data-paper="${size}"]`).forEach(c =>
    c.classList.toggle('active', paperVisible[size])
  );
  updatePaperOverlays();
}

// ── DPI ──
function onDpiChange() {
  dpi = parseInt(document.getElementById('dpiSelect').value);
  document.getElementById('panelDpi').textContent = dpi;
  // Sync mobile chips
  document.querySelectorAll('.mobile-chip[data-dpi]').forEach(c =>
    c.classList.toggle('active', parseInt(c.dataset.dpi) === dpi)
  );
  updateAll();
}

function setMobileDpi(val) {
  dpi = val;
  document.getElementById('dpiSelect').value = val;
  document.getElementById('panelDpi').textContent = val;
  document.querySelectorAll('.mobile-chip[data-dpi]').forEach(c =>
    c.classList.toggle('active', parseInt(c.dataset.dpi) === val)
  );
  updateAll();
}

// ── Print info ──
function updatePrintInfo() {
  document.getElementById('panelPixels').textContent = `${imgW} × ${imgH} px`;
  document.getElementById('panelRatio').textContent = `${(imgW / imgH).toFixed(3)} : 1`;

  const wIn = imgW / dpi, hIn = imgH / dpi;
  const wCm = (wIn * 2.54).toFixed(1), hCm = (hIn * 2.54).toFixed(1);
  document.getElementById('printW').textContent = `${wCm} cm (${wIn.toFixed(1)}″)`;
  document.getElementById('printH').textContent = `${hCm} cm (${hIn.toFixed(1)}″)`;

  let bestFit = '—';
  for (const [size, dims] of Object.entries(PAPERS)) {
    const pw = mmToPixels(dims.w), ph = mmToPixels(dims.h);
    if (imgW <= pw * 1.02 && imgH <= ph * 1.02) { bestFit = size; break; }
  }
  if (bestFit === '—') bestFit = 'Larger than A0';

  let isExact = false;
  if (bestFit !== 'Larger than A0' && bestFit !== '—') {
    const dims = PAPERS[bestFit];
    const pw = mmToPixels(dims.w), ph = mmToPixels(dims.h);
    if ((imgW / pw) > 0.95 && (imgH / ph) > 0.95) isExact = true;
  }

  document.getElementById('bestFit').textContent = isExact
    ? `${bestFit} ✦ exact match` : bestFit;

  const qualEl = document.getElementById('qualityBadge');
  if (dpi >= 300) {
    qualEl.innerHTML = '<div class="info-badge good"><span class="dot"></span>Excellent — press quality</div>';
  } else if (dpi >= 200) {
    qualEl.innerHTML = '<div class="info-badge ok"><span class="dot"></span>Good — standard print</div>';
  } else {
    qualEl.innerHTML = '<div class="info-badge warn"><span class="dot"></span>Adequate — may show softness</div>';
  }
}

// ── Sharpness indicator ──
function updateSharpness() {
  const el = document.getElementById('sharpness');
  const screenDPI = window.devicePixelRatio * 96;
  const effectivePrintZoom = (zoom * screenDPI) / dpi;

  if (zoom >= 0.8) {
    if (effectivePrintZoom >= 0.9) {
      el.style.background = 'rgba(78, 205, 126, 0.1)';
      el.style.borderColor = 'rgba(78, 205, 126, 0.3)';
      el.style.color = '#4ecd7e';
      el.innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span> Viewing at ~actual print detail';
    } else {
      el.style.background = 'rgba(255, 230, 109, 0.1)';
      el.style.borderColor = 'rgba(255, 230, 109, 0.3)';
      el.style.color = '#ffe66d';
      el.innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span> Zoomed — print sharper than screen';
    }
    el.style.opacity = '1';
  } else {
    el.style.opacity = '0';
  }
}

// ── Mobile settings ──
function toggleMobileSettings() {
  mobileSettingsOpen = !mobileSettingsOpen;
  document.getElementById('mobileSettings').classList.toggle('open', mobileSettingsOpen);
  document.getElementById('mobileSettingsBtn').classList.toggle('active', mobileSettingsOpen);
}

function closeMobileSettings() {
  mobileSettingsOpen = false;
  document.getElementById('mobileSettings').classList.remove('open');
  document.getElementById('mobileSettingsBtn').classList.remove('active');
}

// ── Panel toggle ──
function togglePanel() {
  document.getElementById('infoPanel').classList.toggle('collapsed');
}

// ── Pan / Drag ──
viewport.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  viewport.classList.add('dragging');
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  updateAll();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// ── Scroll zoom ──
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  setZoom(zoom * (1 + delta), cx, cy);
}, { passive: false });

// ── Touch support ──
let lastTouchDist = 0;
let lastTouchCenter = null;
let touchStartTime = 0;

viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    panStartX = panX; panStartY = panY;
    touchStartTime = Date.now();
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
    const rect = viewport.getBoundingClientRect();
    lastTouchCenter = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top
    };
  }
  e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    panX = panStartX + (e.touches[0].clientX - dragStartX);
    panY = panStartY + (e.touches[0].clientY - dragStartY);
    updateAll();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    if (lastTouchDist > 0) {
      setZoom(zoom * (dist / lastTouchDist), lastTouchCenter.x, lastTouchCenter.y);
    }
    lastTouchDist = dist;
  }
  e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchend', e => {
  // Double-tap to zoom
  if (e.touches.length === 0 && (Date.now() - touchStartTime) < 200) {
    const now = Date.now();
    if (viewport._lastTap && (now - viewport._lastTap) < 300) {
      const rect = viewport.getBoundingClientRect();
      const cx = e.changedTouches[0].clientX - rect.left;
      const cy = e.changedTouches[0].clientY - rect.top;
      if (zoom < 0.5) setZoom(0.5, cx, cy);
      else if (zoom < 1) setZoom(1, cx, cy);
      else zoomToFit();
      viewport._lastTap = 0;
    } else {
      viewport._lastTap = now;
    }
  }
  isDragging = false;
  lastTouchDist = 0;
});

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case '=': case '+': e.preventDefault(); zoomDelta(0.15); break;
    case '-': case '_': e.preventDefault(); zoomDelta(-0.15); break;
    case '0': e.preventDefault(); zoomToFit(); break;
    case '1': e.preventDefault(); setZoom(1); break;
    case '2': e.preventDefault(); setZoom(2); break;
    case '5': e.preventDefault(); setZoom(0.5); break;
    case 'p': case 'P': e.preventDefault(); togglePanel(); break;
  }
});

// ── Zoom slider ──
zoomSlider.addEventListener('input', () => {
  setZoom(parseInt(zoomSlider.value) / 100);
});

// ── Window resize ──
window.addEventListener('resize', () => { updateAll(); });

// ── Desktop: start with info panel open ──
if (isDesktop()) {
  document.getElementById('infoPanel').classList.remove('collapsed');
}
</script>
</body>
</html>
