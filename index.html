<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEDx Newy Salon — Map Print Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #FF2B06;
  --red-dim: #FF2B0633;
  --red-glow: #FF2B0618;
  --bg: #0a0a0c;
  --surface: #111114;
  --surface-2: #18181c;
  --surface-3: #222228;
  --border: #2a2a30;
  --border-light: #3a3a42;
  --text: #e8e8ec;
  --text-dim: #8a8a94;
  --text-muted: #5a5a64;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 52px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  backdrop-filter: blur(12px);
  background: rgba(17, 17, 20, 0.92);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-brand {
  display: flex;
  align-items: baseline;
  gap: 0;
}

.header-brand .tedx {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 15px;
  color: var(--red);
  letter-spacing: -0.02em;
}

.header-brand .newy {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 15px;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-left: 4px;
}

.header-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
}

.header-title {
  font-family: var(--sans);
  font-weight: 400;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.01em;
  transition: opacity 0.2s ease;
}

.header-subtitle {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: var(--surface-2);
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.kbd-hint {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.kbd-hint kbd {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 9px;
  color: var(--text-dim);
}

/* ── MAP SWITCHER ── */
.map-switcher {
  position: fixed;
  top: 52px;
  left: 0;
  right: 0;
  height: 40px;
  background: rgba(14, 14, 17, 0.97);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 4px;
  z-index: 100;
}

.map-switcher-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 8px;
}

.map-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 400;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
  position: relative;
}

.map-btn:hover {
  background: var(--surface-2);
  border-color: var(--border);
  color: var(--text);
}

.map-btn.active {
  background: var(--red-dim);
  border-color: var(--red);
  color: #fff;
  font-weight: 500;
}

.map-btn.unavailable {
  opacity: 0.4;
}

.map-btn.unavailable::after {
  content: 'soon';
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-muted);
  position: absolute;
  top: -2px;
  right: -2px;
  background: var(--surface-3);
  padding: 1px 4px;
  border-radius: 3px;
  letter-spacing: 0.04em;
}

/* ── TOOLBAR ── */
.toolbar {
  position: fixed;
  top: 92px;
  left: 0;
  right: 0;
  height: 42px;
  background: rgba(14, 14, 17, 0.95);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 6px;
  z-index: 100;
  backdrop-filter: blur(8px);
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 2px;
}

.tool-sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 8px;
}

.tool-btn {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
}

.tool-btn:hover {
  background: var(--surface-2);
  border-color: var(--border);
  color: var(--text);
}

.tool-btn.active {
  background: var(--red-dim);
  border-color: var(--red);
  color: var(--red);
}

.tool-btn.zoom-preset {
  min-width: 44px;
  text-align: center;
}

.tool-btn.zoom-preset.current {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-light);
}

.zoom-display {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  min-width: 56px;
  text-align: center;
  padding: 4px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
}

.zoom-slider-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 4px;
}

.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100px;
  height: 3px;
  background: var(--surface-3);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--red);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 6px var(--red-dim);
}

.tool-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 6px;
}

.tool-select {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  outline: none;
}

.tool-select:hover { border-color: var(--border-light); }
.tool-select:focus { border-color: var(--red); }

.tool-select option {
  background: var(--surface);
  color: var(--text);
}

/* ── VIEWPORT ── */
.viewport {
  position: fixed;
  top: 134px;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
  cursor: grab;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,43,6,0.02) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
  background-color: var(--bg);
}

.viewport.dragging { cursor: grabbing; }

.canvas-container {
  position: absolute;
  transform-origin: 0 0;
  will-change: transform;
}

.canvas-container img {
  display: block;
  image-rendering: auto;
  pointer-events: none;
}

/* ── PAPER OVERLAYS ── */
.paper-overlay {
  position: absolute;
  top: 0;
  left: 0;
  border: 2px dashed rgba(255, 255, 255, 0.5);
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.paper-overlay .paper-label {
  position: absolute;
  top: -1px;
  left: -1px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  color: #fff;
  white-space: nowrap;
}

.paper-overlay .paper-dims {
  position: absolute;
  bottom: 6px;
  right: 8px;
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
}

.paper-overlay[data-size="A0"] {
  border-color: #a78bfa;
}
.paper-overlay[data-size="A0"] .paper-label {
  background: #a78bfa;
  color: #0a0a0c;
}
.paper-overlay[data-size="A0"] .paper-dims {
  background: rgba(167, 139, 250, 0.2);
  color: #a78bfa;
}

.paper-overlay[data-size="A1"] {
  border-color: #4ecdc4;
}
.paper-overlay[data-size="A1"] .paper-label {
  background: #4ecdc4;
  color: #0a0a0c;
}
.paper-overlay[data-size="A1"] .paper-dims {
  background: rgba(78, 205, 196, 0.2);
  color: #4ecdc4;
}

.paper-overlay[data-size="A2"] {
  border-color: var(--red);
}
.paper-overlay[data-size="A2"] .paper-label {
  background: var(--red);
  color: #fff;
}
.paper-overlay[data-size="A2"] .paper-dims {
  background: rgba(255, 43, 6, 0.2);
  color: var(--red);
}

.paper-overlay[data-size="A3"] {
  border-color: #ffe66d;
}
.paper-overlay[data-size="A3"] .paper-label {
  background: #ffe66d;
  color: #0a0a0c;
}
.paper-overlay[data-size="A3"] .paper-dims {
  background: rgba(255, 230, 109, 0.2);
  color: #ffe66d;
}

/* ── PRINT INFO PANEL ── */
.info-panel {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 280px;
  background: rgba(17, 17, 20, 0.94);
  border: 1px solid var(--border);
  border-radius: 8px;
  backdrop-filter: blur(12px);
  z-index: 90;
  overflow: hidden;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.info-panel.collapsed {
  transform: translateY(calc(100% - 36px));
}

.info-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}

.info-panel-header:hover { background: var(--surface-3); }

.info-panel-title {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}

.info-panel-toggle {
  font-size: 12px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
}

.info-panel.collapsed .info-panel-toggle { transform: rotate(180deg); }

.info-panel-body {
  padding: 14px;
}

.info-section {
  margin-bottom: 14px;
}

.info-section:last-child { margin-bottom: 0; }

.info-section-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
}

.info-row-label {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--text-dim);
}

.info-row-value {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
}

.info-row-value.match {
  color: var(--red);
}

.info-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 4px;
  margin-top: 4px;
}

.info-badge.good {
  background: rgba(78, 205, 126, 0.12);
  color: #4ecd7e;
  border: 1px solid rgba(78, 205, 126, 0.25);
}

.info-badge.ok {
  background: rgba(255, 230, 109, 0.12);
  color: #ffe66d;
  border: 1px solid rgba(255, 230, 109, 0.25);
}

.info-badge.warn {
  background: rgba(255, 43, 6, 0.12);
  color: var(--red);
  border: 1px solid rgba(255, 43, 6, 0.25);
}

.info-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ── SHARPNESS INDICATOR ── */
.sharpness-indicator {
  position: fixed;
  bottom: 16px;
  left: 16px;
  font-family: var(--mono);
  font-size: 10px;
  padding: 6px 12px;
  border-radius: 5px;
  backdrop-filter: blur(8px);
  z-index: 90;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid;
}

/* ── IMAGE DIMENSIONS LABEL ── */
.img-dims {
  position: absolute;
  bottom: -24px;
  left: 0;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
  white-space: nowrap;
  pointer-events: none;
}

/* ── LOADING ── */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.4s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loading-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 14px;
  letter-spacing: 0.04em;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── CROSSHAIR AT CENTER ── */
.crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  pointer-events: none;
  z-index: 50;
  opacity: 0.15;
}

.crosshair::before, .crosshair::after {
  content: '';
  position: absolute;
  background: var(--text-muted);
}

.crosshair::before {
  width: 1px;
  height: 20px;
  top: -10px;
  left: 0;
}

.crosshair::after {
  width: 20px;
  height: 1px;
  top: 0;
  left: -10px;
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading map image…</div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-brand">
      <span class="tedx">TEDx</span><span class="newy">Newy Salon</span>
    </div>
    <div class="header-sep"></div>
    <span class="header-title" id="headerTitle">Night Culture and Economy</span>
    <span class="header-subtitle">Print Preview</span>
  </div>
  <div class="header-right">
    <div class="kbd-hint">
      <kbd>+</kbd><kbd>−</kbd> zoom
      <kbd>0</kbd> fit
      <kbd>1</kbd> 100%
      <kbd>P</kbd> panel
    </div>
  </div>
</div>

<!-- Map Switcher -->
<div class="map-switcher">
  <span class="map-switcher-label">Map</span>
  <button class="map-btn active" data-map="night-culture" onclick="switchMap('night-culture')">Night Culture and Economy</button>
  <button class="map-btn" data-map="health" onclick="switchMap('health')">Health and Wellbeing</button>
  <button class="map-btn" data-map="transport-cbd" onclick="switchMap('transport-cbd')">Transport and Mobility CBD</button>
  <button class="map-btn" data-map="transport-regional" onclick="switchMap('transport-regional')">Transport and Mobility Regional</button>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="tool-group">
    <span class="tool-label">Zoom</span>
    <button class="tool-btn" onclick="zoomDelta(-0.15)" title="Zoom out">−</button>
    <div class="zoom-slider-wrap">
      <input type="range" class="zoom-slider" id="zoomSlider" min="2" max="250" value="20">
    </div>
    <button class="tool-btn" onclick="zoomDelta(0.15)" title="Zoom in">+</button>
    <div class="zoom-display" id="zoomDisplay">20%</div>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group">
    <button class="tool-btn zoom-preset" data-zoom="fit" onclick="zoomToFit()">Fit</button>
    <button class="tool-btn zoom-preset" data-zoom="0.5" onclick="setZoom(0.5)">50%</button>
    <button class="tool-btn zoom-preset" data-zoom="1" onclick="setZoom(1)">100%</button>
    <button class="tool-btn zoom-preset" data-zoom="2" onclick="setZoom(2)">200%</button>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group">
    <span class="tool-label">DPI</span>
    <select class="tool-select" id="dpiSelect" onchange="onDpiChange()">
      <option value="300" selected>300 DPI</option>
      <option value="200">200 DPI</option>
      <option value="150">150 DPI</option>
    </select>
  </div>

  <div class="tool-sep"></div>

  <div class="tool-group">
    <span class="tool-label">Paper</span>
    <button class="tool-btn" id="toggleA0" onclick="togglePaper('A0')">A0</button>
    <button class="tool-btn" id="toggleA1" onclick="togglePaper('A1')">A1</button>
    <button class="tool-btn active" id="toggleA2" onclick="togglePaper('A2')">A2</button>
    <button class="tool-btn" id="toggleA3" onclick="togglePaper('A3')">A3</button>
  </div>
</div>

<!-- Viewport -->
<div class="viewport" id="viewport">
  <div class="canvas-container" id="canvas">
    <img id="mapImg" draggable="false">
    <div class="img-dims" id="imgDims"></div>

    <!-- Paper overlays -->
    <div class="paper-overlay" id="overlayA0" data-size="A0" style="display:none;">
      <span class="paper-label">A0</span>
      <span class="paper-dims" id="dimsA0"></span>
    </div>
    <div class="paper-overlay" id="overlayA1" data-size="A1" style="display:none;">
      <span class="paper-label">A1</span>
      <span class="paper-dims" id="dimsA1"></span>
    </div>
    <div class="paper-overlay" id="overlayA2" data-size="A2">
      <span class="paper-label">A2</span>
      <span class="paper-dims" id="dimsA2"></span>
    </div>
    <div class="paper-overlay" id="overlayA3" data-size="A3" style="display:none;">
      <span class="paper-label">A3</span>
      <span class="paper-dims" id="dimsA3"></span>
    </div>
  </div>
  <div class="crosshair"></div>
</div>

<!-- Sharpness Indicator -->
<div class="sharpness-indicator" id="sharpness"></div>

<!-- Print Info Panel -->
<div class="info-panel" id="infoPanel">
  <div class="info-panel-header" onclick="togglePanel()">
    <span class="info-panel-title">Print Specifications</span>
    <span class="info-panel-toggle">▼</span>
  </div>
  <div class="info-panel-body">
    <div class="info-section">
      <div class="info-section-label">Source Image</div>
      <div class="info-row">
        <span class="info-row-label">Pixels</span>
        <span class="info-row-value" id="panelPixels"></span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Aspect ratio</span>
        <span class="info-row-value" id="panelRatio"></span>
      </div>
    </div>

    <div class="info-section">
      <div class="info-section-label">Print Size at <span id="panelDpi">300</span> DPI</div>
      <div class="info-row">
        <span class="info-row-label">Width</span>
        <span class="info-row-value" id="printW"></span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Height</span>
        <span class="info-row-value" id="printH"></span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Best paper fit</span>
        <span class="info-row-value match" id="bestFit"></span>
      </div>
    </div>

    <div class="info-section">
      <div class="info-section-label">Print Quality</div>
      <div id="qualityBadge"></div>
    </div>
  </div>
</div>

<script>
// ── Map configurations ──
const MAPS = {
  'night-culture': {
    title: 'Night Culture and Economy',
    file: 'Night Culture.png',
    w: 7021,
    h: 4967,
  },
  'health': {
    title: 'Health and Wellbeing',
    file: 'Health and Wellbeing.png',
    w: 5266,
    h: 3725,
  },
  'transport-cbd': {
    title: 'Transport and Mobility CBD',
    file: 'Transport and Mobility - CBD.png',
    w: 7021,
    h: 4967,
  },
  'transport-regional': {
    title: 'Transport and Mobility Regional',
    file: 'Transport and Mobility - Regional.png',
    w: 7021,
    h: 4967,
  },
};

let currentMapId = 'night-culture';

// Paper sizes in mm (landscape)
const PAPERS = {
  A0: { w: 1189, h: 841 },
  A1: { w: 841, h: 594 },
  A2: { w: 594, h: 420 },
  A3: { w: 420, h: 297 },
};

// ── State ──
let imgW = 7021;
let imgH = 4967;
let zoom = 0.2;
let panX = 0;
let panY = 0;
let dpi = 300;
let isDragging = false;
let dragStartX, dragStartY, panStartX, panStartY;
let paperVisible = { A0: false, A1: false, A2: true, A3: false };

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
const mapImg = document.getElementById('mapImg');
const zoomSlider = document.getElementById('zoomSlider');
const zoomDisplay = document.getElementById('zoomDisplay');

// ── Map switching ──
function switchMap(mapId) {
  const map = MAPS[mapId];
  if (!map) return;

  currentMapId = mapId;

  // Update button states
  document.querySelectorAll('.map-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.map === mapId);
  });

  // Update header title
  document.getElementById('headerTitle').textContent = map.title;

  // Show loading
  const loading = document.getElementById('loading');
  loading.classList.remove('hidden');
  loading.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">Loading ' + map.title + '…</div>';

  // Load image
  mapImg.onload = function() {
    // Use known dimensions if available, otherwise read from image
    if (map.w && map.h) {
      imgW = map.w;
      imgH = map.h;
    } else {
      imgW = mapImg.naturalWidth;
      imgH = mapImg.naturalHeight;
      // Save detected dimensions
      map.w = imgW;
      map.h = imgH;
    }

    document.getElementById('imgDims').textContent = `${imgW} × ${imgH} px`;
    zoomToFit();
    updateAll();
    setTimeout(() => loading.classList.add('hidden'), 200);
  };

  mapImg.onerror = function() {
    loading.innerHTML =
      '<div style="color:var(--text-dim);font-family:var(--mono);font-size:12px;text-align:center;line-height:1.8;">' +
      'Image not yet available:<br><span style="color:var(--text);">' + map.file + '</span>' +
      '<br><br><span style="color:var(--text-muted);font-size:11px;">Drop the PNG into the TEDxNewy Salon Maps folder<br>with this filename, then refresh.</span></div>';
  };

  mapImg.src = map.file;
}

// ── Initial load ──
switchMap('night-culture');

// ── Zoom ──
function setZoom(z, centerX, centerY) {
  const oldZoom = zoom;
  zoom = Math.max(0.02, Math.min(3, z));

  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const cx = centerX !== undefined ? centerX : vw / 2;
  const cy = centerY !== undefined ? centerY : vh / 2;

  panX = cx - (cx - panX) * (zoom / oldZoom);
  panY = cy - (cy - panY) * (zoom / oldZoom);

  updateAll();
}

function zoomDelta(d) {
  setZoom(zoom * (1 + d));
}

function zoomToFit() {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const padding = 60;
  const fitZoom = Math.min((vw - padding) / imgW, (vh - padding) / imgH);
  zoom = fitZoom;
  panX = (vw - imgW * zoom) / 2;
  panY = (vh - imgH * zoom) / 2;
  updateAll();
}

function updateAll() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;

  const pct = Math.round(zoom * 100);
  zoomDisplay.textContent = pct + '%';
  zoomSlider.value = Math.min(250, Math.max(2, pct));

  document.querySelectorAll('.zoom-preset').forEach(btn => {
    btn.classList.remove('current');
    const target = btn.dataset.zoom;
    if (target === 'fit') return;
    if (Math.abs(parseFloat(target) - zoom) < 0.005) btn.classList.add('current');
  });

  updatePaperOverlays();
  updatePrintInfo();
  updateSharpness();
}

// ── Paper overlays ──
function mmToPixels(mm) {
  return (mm / 25.4) * dpi;
}

function updatePaperOverlays() {
  for (const [size, dims] of Object.entries(PAPERS)) {
    const el = document.getElementById('overlay' + size);
    const dimsEl = document.getElementById('dims' + size);

    if (!paperVisible[size]) {
      el.style.display = 'none';
      continue;
    }

    const pw = mmToPixels(dims.w);
    const ph = mmToPixels(dims.h);

    el.style.display = 'block';
    el.style.width = pw + 'px';
    el.style.height = ph + 'px';

    dimsEl.textContent = `${dims.w} × ${dims.h} mm`;
  }
}

function togglePaper(size) {
  paperVisible[size] = !paperVisible[size];
  document.getElementById('toggle' + size).classList.toggle('active');
  updatePaperOverlays();
}

// ── DPI ──
function onDpiChange() {
  dpi = parseInt(document.getElementById('dpiSelect').value);
  document.getElementById('panelDpi').textContent = dpi;
  updateAll();
}

// ── Print info ──
function updatePrintInfo() {
  // Source image info
  document.getElementById('panelPixels').textContent = `${imgW} × ${imgH} px`;
  const ratio = (imgW / imgH).toFixed(3);
  document.getElementById('panelRatio').textContent = `${ratio} : 1`;

  const wIn = imgW / dpi;
  const hIn = imgH / dpi;
  const wCm = (wIn * 2.54).toFixed(1);
  const hCm = (hIn * 2.54).toFixed(1);

  document.getElementById('printW').textContent = `${wCm} cm (${wIn.toFixed(1)}″)`;
  document.getElementById('printH').textContent = `${hCm} cm (${hIn.toFixed(1)}″)`;

  // Find smallest paper that fits the image
  let bestFit = '—';
  const sortedPapers = Object.entries(PAPERS).reverse(); // A3 → A0
  for (const [size, dims] of Object.entries(PAPERS)) {
    const pw = mmToPixels(dims.w);
    const ph = mmToPixels(dims.h);
    if (imgW <= pw * 1.02 && imgH <= ph * 1.02) {
      bestFit = size;
      break;
    }
  }

  if (bestFit === '—') {
    bestFit = 'Larger than A0';
  }

  // Check for exact/near-exact match (image fills >95% of paper)
  let isExact = false;
  if (bestFit !== 'Larger than A0' && bestFit !== '—') {
    const dims = PAPERS[bestFit];
    const pw = mmToPixels(dims.w);
    const ph = mmToPixels(dims.h);
    const fillW = imgW / pw;
    const fillH = imgH / ph;
    if (fillW > 0.95 && fillH > 0.95) {
      isExact = true;
    }
  }

  document.getElementById('bestFit').textContent = isExact
    ? `${bestFit} ✦ exact match`
    : bestFit;

  // Quality badge
  const qualEl = document.getElementById('qualityBadge');
  if (dpi >= 300) {
    qualEl.innerHTML = '<div class="info-badge good"><span class="dot"></span>Excellent — press quality</div>';
  } else if (dpi >= 200) {
    qualEl.innerHTML = '<div class="info-badge ok"><span class="dot"></span>Good — standard print</div>';
  } else {
    qualEl.innerHTML = '<div class="info-badge warn"><span class="dot"></span>Adequate — may show softness at fine detail</div>';
  }
}

// ── Sharpness indicator ──
function updateSharpness() {
  const el = document.getElementById('sharpness');
  const screenDPI = window.devicePixelRatio * 96;
  const effectivePrintZoom = (zoom * screenDPI) / dpi;

  if (zoom >= 0.8) {
    if (effectivePrintZoom >= 0.9) {
      el.style.background = 'rgba(78, 205, 126, 0.1)';
      el.style.borderColor = 'rgba(78, 205, 126, 0.3)';
      el.style.color = '#4ecd7e';
      el.innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span> Viewing at ~actual print detail';
    } else {
      el.style.background = 'rgba(255, 230, 109, 0.1)';
      el.style.borderColor = 'rgba(255, 230, 109, 0.3)';
      el.style.color = '#ffe66d';
      el.innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span> Zoomed in — print will be sharper than screen';
    }
    el.style.opacity = '1';
  } else {
    el.style.opacity = '0';
  }
}

// ── Pan / Drag ──
viewport.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  panStartX = panX;
  panStartY = panY;
  viewport.classList.add('dragging');
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  updateAll();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// ── Scroll zoom ──
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  setZoom(zoom * (1 + delta), cx, cy);
}, { passive: false });

// ── Touch support ──
let lastTouchDist = 0;
let lastTouchCenter = null;

viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    panStartX = panX;
    panStartY = panY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
    lastTouchCenter = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - viewport.getBoundingClientRect().left,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - viewport.getBoundingClientRect().top
    };
  }
  e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    panX = panStartX + (e.touches[0].clientX - dragStartX);
    panY = panStartY + (e.touches[0].clientY - dragStartY);
    updateAll();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    if (lastTouchDist > 0) {
      const scale = dist / lastTouchDist;
      setZoom(zoom * scale, lastTouchCenter.x, lastTouchCenter.y);
    }
    lastTouchDist = dist;
  }
  e.preventDefault();
}, { passive: false });

viewport.addEventListener('touchend', () => {
  isDragging = false;
  lastTouchDist = 0;
});

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case '=': case '+': e.preventDefault(); zoomDelta(0.15); break;
    case '-': case '_': e.preventDefault(); zoomDelta(-0.15); break;
    case '0': e.preventDefault(); zoomToFit(); break;
    case '1': e.preventDefault(); setZoom(1); break;
    case '2': e.preventDefault(); setZoom(2); break;
    case '5': e.preventDefault(); setZoom(0.5); break;
    case 'p': case 'P': e.preventDefault(); togglePanel(); break;
  }
});

// ── Zoom slider ──
zoomSlider.addEventListener('input', () => {
  setZoom(parseInt(zoomSlider.value) / 100);
});

// ── Panel toggle ──
function togglePanel() {
  document.getElementById('infoPanel').classList.toggle('collapsed');
}

// ── Window resize ──
window.addEventListener('resize', () => {
  updateAll();
});
</script>
</body>
</html>
